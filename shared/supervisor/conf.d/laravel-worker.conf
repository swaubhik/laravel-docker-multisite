# ; ===========================================
# ; 🚀 Laravel Queue Worker (Conditional)
# ; ===========================================

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=/bin/sh -c "if [ \"$ENABLE_QUEUE\" = \"true\" ]; then php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256; else sleep infinity; fi"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600


# ; ===========================================
# ; 🕒 Laravel Scheduler (Conditional)
# ; ===========================================

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "if [ \"$ENABLE_SCHEDULER\" = \"true\" ]; then php /var/www/html/artisan schedule:work; else sleep infinity; fi"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3